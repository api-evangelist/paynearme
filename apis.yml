aid: paynearme
name: PayNearMe
description: >-
  PayNearMe is a modern payments platform that helps businesses accept, disburse,
  and manage payments across cash, card, ACH, digital wallets and pay-by-bank
  while lowering the total cost of acceptance by increasing acceptance rates,
  driving self-service, and simplifying payment exceptions. It is best known for
  its cash-at-retail network of 62,000+ locations (7-Eleven, CVS, Walmart,
  Walgreens, Kroger, Casey's, Family Dollar, Dollar General and more) alongside
  a full electronic billing and payments stack. PayNearMe serves auto and
  consumer lending, credit unions, iGaming and sports betting, buy-here-pay-here
  dealers, tolling, mortgage servicing, and law firms, and integrates with
  merchant loan-management and dealer platforms through server-to-server
  callbacks (webhooks) and a partner API. This profile was added to the API
  Evangelist network from a VC portfolio lead and enriched from PayNearMe's
  public developer, security, and integration surface.
